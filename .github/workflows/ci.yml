# Analyse and test on every push.
#
# The vendored hospital_core is part of this repository, so a broken sync shows
# up here rather than in a lab session.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse
        run: flutter analyze

      - name: Test
        run: flutter test

  core:
    name: hospital_core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hospital_core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  server:
    name: API server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hospital
          POSTGRES_PASSWORD: hospital
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hospital"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed bin lib
      - run: dart analyze

      - name: Apply the schema and seed
        working-directory: .
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: hospital
          PGPASSWORD: hospital
        run: ./infrastructure/db/apply.sh

      - name: The schema enforces its own rules
        working-directory: .
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: hospital
          PGPASSWORD: hospital
        run: psql -d EHR_DB -v ON_ERROR_STOP=1 -f infrastructure/db/test_schema.sql
