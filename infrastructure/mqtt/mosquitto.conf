# Mosquitto for the mini-hospital, shaped by where it runs.
#
# Cloud Run speaks HTTP, HTTP/2, gRPC and WebSocket, and nothing else. A
# browser cannot open a TCP socket either. So the only listener here carries
# MQTT over WebSocket - which is what MqttBrowserClient connects to, and the
# reason the Flutter web applications can be MQTT clients at all.
#
# The port is fixed rather than read from $PORT because Mosquitto does not
# expand environment variables in its configuration. deploy_mqtt.sh passes the
# same number to Cloud Run with --port, and the two must agree.
listener 9001
protocol websockets

# Anonymous access would mean anyone who finds the URL can publish a heart
# rate for a named patient. The credentials are one shared account, which is
# thin - but it is the difference between a closed door and none.
allow_anonymous false
password_file /mosquitto/config/passwd

# The container filesystem does not survive a revision, and a single instance
# has nowhere to persist to that another instance would read. Sessions are
# therefore in memory: a client that reconnects resubscribes. Retained
# messages live only as long as the instance, which is worth telling the
# students before they design around them.
persistence false

# Cloud Logging reads stdout.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# A device that stops sending is clinically interesting, so keepalives are
# kept short enough that a silent monitor is noticed in seconds rather than
# minutes. The last-will message a client registers is published when this
# elapses without a packet.
max_keepalive 60
