# The writes the applications perform.
#
# Note what is *not* here: there is no "admit patient" mutation that updates
# the encounter, the bed and the movement log together. Data Connect generates
# one mutation per table, so a multi-table operation has to be composed on the
# client - which is precisely the transactional gap `AdtService` documents in
# the ADT application. Worth showing students side by side with the SQL.

mutation UpsertPatient(
  $id: String!
  $mrn: String!
  $nationalNumber: String
  $familyName: String!
  $givenName: String!
  $gender: String!
  $birthDate: Date!
  $address: Any
  $phone: String
  $email: String
  $preferredLanguage: String!
  $bloodGroup: String
  $generalPractitioner: String
) @auth(level: USER) {
  patient_upsert(
    data: {
      id: $id
      mrn: $mrn
      nationalNumber: $nationalNumber
      familyName: $familyName
      givenName: $givenName
      gender: $gender
      birthDate: $birthDate
      address: $address
      phone: $phone
      email: $email
      preferredLanguage: $preferredLanguage
      bloodGroup: $bloodGroup
      generalPractitioner: $generalPractitioner
    }
  )
}

mutation UpsertEncounter(
  $id: String!
  $patientId: String!
  $status: String!
  $encounterClass: String!
  $admissionDate: Timestamp!
  $dischargeDate: Timestamp
  $wardId: String
  $roomId: String
  $bedId: String
  $reason: String
  $dischargeDisposition: String
  $visitNumber: String
  $attendingPractitioner: String
) @auth(level: USER) {
  encounter_upsert(
    data: {
      id: $id
      patientId: $patientId
      status: $status
      encounterClass: $encounterClass
      admissionDate: $admissionDate
      dischargeDate: $dischargeDate
      wardId: $wardId
      roomId: $roomId
      bedId: $bedId
      reason: $reason
      dischargeDisposition: $dischargeDisposition
      visitNumber: $visitNumber
      attendingPractitioner: $attendingPractitioner
    }
  )
}

mutation UpdateBedStatus(
  $id: String!
  $status: String!
  $currentEncounterId: String
  $currentPatientId: String
) @auth(level: USER) {
  bed_update(
    key: { id: $id }
    data: {
      status: $status
      currentEncounterId: $currentEncounterId
      currentPatientId: $currentPatientId
    }
  )
}

