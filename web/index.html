<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mini-Hospital 2026 - Connected medical device simulators">

  <meta name="theme-color" content="#00696D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Devices">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mini-Hospital Devices</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Some Linux desktops report a POSIX-style locale such as "en-US@posix".
    // `Intl.Locale` rejects it, Flutter’s engine does not guard against that,
    // and the application then fails to start with "Incorrect locale
    // information provided" — a blank white page and nothing in the UI to
    // explain it. Normalise the value before Flutter reads it.
    (function () {
      try {
        new Intl.Locale(navigator.language);
      } catch (_) {
        var clean =
          String(navigator.language || "en").split("@")[0].replace(/[^A-Za-z0-9-]/g, "") ||
          "en";
        var languages = [clean];
        Object.defineProperty(navigator, "language", { get: function () { return clean; } });
        Object.defineProperty(navigator, "languages", { get: function () { return languages; } });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
